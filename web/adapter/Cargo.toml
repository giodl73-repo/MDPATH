[package]
name = "mdpath-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mdpath-inspect"
path = "src/main.rs"

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
mdpath = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.127", optional = true }
